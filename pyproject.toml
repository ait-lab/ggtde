[tool.poetry]
name = "ggtde"
version = "4"
description = "Generalized Gaussian Temporal Difference Error for Uncertainty-aware Reinforcement Learning"
authors = [
  "Joonhun Lee <joonhun.lee@qraftec.com>",
  "Seyeon Kim <seyeon.kim@qraftec.com>",
]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.9"
gymnasium = { extras = ["box2d", "mujoco"], version = "~0.29" }
pyyaml = "~6.0"
rl-zoo3 = "~2.2"
scipy = "~1.12"
tensorboard = "~2.16"
torch = "~2.2"
wandb = "~0.18"

[tool.poetry.group.dev.dependencies]
black = "~24.3"
ipykernel = "~6.29"
isort = "~5.13"
pre-commit = "~3.8"
scienceplots = "~2.1"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.ruff]
exclude = [
  ".git",
  ".git-rewrite",
  ".ipynb_checkpoints",
  ".ruff_cache",
  ".vscode",
  "__pypackages__",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
